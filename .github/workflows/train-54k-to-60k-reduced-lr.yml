name: RONIN-10M — recover 54k and continue 6k with reduced learning rate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/train-54k-to-60k-reduced-lr.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: roninia-10m-54k-to-60k-reduced-lr
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    env:
      SOURCE_RUN_ID: "43025252739"
      CORPUS_RUN_ID: "42523463620"
      TOKEN_CACHE_RUN_ID: "42890884432"
      EXPECTED_PARENT_SHA256: "5eb84ddd7df2512336bf7d86f590eeaf0a8007d9057ecd05167bcd4d9f963d9d"
      EXPECTED_TOKENIZER_SHA256: "605834d0d1deea545518be54ae0936060845107b906172f6628d0ff952e57a4"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU checkpoint and training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy tokenizers

      - name: Verify cancelled source run and recoverable checkpoint artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/orbitalronin94/RONINIA/actions/runs/$SOURCE_RUN_ID")"
          test "$(jq -r .status <<<"$run")" = "completed"
          test "$(jq -r .conclusion <<<"$run")" = "cancelled"
          echo "$run" | jq '{id, status, conclusion, html_url}'
          artifacts="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/orbitalronin94/RONINIA/actions/runs/$SOURCE_RUN_ID/artifacts")"
          echo "$artifacts" | jq -e '.artifacts[] | select(.name == "ronin-10m-checkpoints-60k-43025252739" and .expired == false)' >/dev/null

      - name: Download checkpoint recovery artifact from cancelled run
        uses: actions/download-artifact@v4
        with:
          name: ronin-10m-checkpoints-60k-${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          repository: orbitalronin94/RONINIA
          run-id: ${{ env.SOURCE_RUN_ID }}
          path: recovered-checkpoints

      - name: Resolve and verify exact 54k checkpoint
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find recovered-checkpoints -type f -name 'checkpoint-54000.pt' -size +0c)
          if [ "${#candidates[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one checkpoint-54000.pt, found ${#candidates[@]}"
            find recovered-checkpoints -maxdepth 4 -type f -printf '%p %s bytes\\n'
            exit 1
          fi
          cp "${candidates[0]}" parent-artifact-checkpoint-54000.pt
          actual="$(sha256sum parent-artifact-checkpoint-54000.pt | awk '{print $1}')"
          echo "Recovered 54k checkpoint SHA-256: $actual"
          test "$actual" = "$EXPECTED_PARENT_SHA256"
          python - <<'PY'
          import torch
          p=torch.load("parent-artifact-checkpoint-54000.pt",map_location="cpu",weights_only=False)
          assert int(p.get("completed_steps",-1)) == 54000, p.get("completed_steps")
          assert p.get("validation_loss") is not None, "checkpoint lacks validation_loss"
          print({
            "completed_steps":p["completed_steps"],
            "validation_loss":p["validation_loss"],
            "parameter_count":p.get("parameter_count"),
            "corpus_sha256":p.get("corpus_sha256"),
            "tokenizer_sha256":p.get("tokenizer_sha256")
          })
          PY

      - name: Verify full MINIRONIN corpus source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/orbitalronin94/MINIRONIN/actions/runs/$CORPUS_RUN_ID")"
          test "$(jq -r .status <<<"$run")" = "completed"
          test "$(jq -r .conclusion <<<"$run")" = "success"
          test "$(jq -r .head_branch <<<"$run")" = "main"

      - name: Download complete prebuilt MINIRONIN corpus artifact
        uses: actions/download-artifact@v4
        with:
          name: minironin-unified-train-corpus-${{ env.CORPUS_RUN_ID }}
          github-token: ${{ github.token }}
          repository: orbitalronin94/MINIRONIN
          run-id: ${{ env.CORPUS_RUN_ID }}
          path: minironin-unified

      - name: Verify corpus artifact and prepared-corpus identity
        run: |
          set -euo pipefail
          test -s minironin-unified/train.jsonl.gz
          test -s minironin-unified/sources.json
          test -s minironin-unified/quality-report.json
          test -s minironin-unified/SHA256SUMS
          (cd minironin-unified && sha256sum -c SHA256SUMS)
          available=$(df --output=avail -k . | tail -1 | tr -d ' ')
          test "$available" -gt 3000000
          python scripts/prepare_corpus.py --input-root minironin-unified \
            --output data/corpus/train.txt --manifest data/corpus/corpus-manifest.json \
            --source-run-id "$CORPUS_RUN_ID"
          test -s data/corpus/train.txt

      - name: Download existing full-corpus token cache
        uses: actions/download-artifact@v4
        with:
          name: roninia-token-cache-${{ env.TOKEN_CACHE_RUN_ID }}
          github-token: ${{ github.token }}
          repository: orbitalronin94/RONINIA
          run-id: ${{ env.TOKEN_CACHE_RUN_ID }}
          path: token-cache

      - name: Verify cache identity and exact tokenizer
        run: |
          set -euo pipefail
          test -s token-cache/corpus-tokens.u16
          test -s token-cache/token-manifest.json
          test -s token-cache/SHA256SUMS
          (cd token-cache && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import json,os
          from pathlib import Path
          corpus=json.loads(Path("data/corpus/corpus-manifest.json").read_text())
          cache=json.loads(Path("token-cache/token-manifest.json").read_text())
          assert cache.get("schema") == "roninia-token-cache-v1", cache
          assert cache.get("dtype") == "uint16", cache
          assert cache.get("vocab_size") == 8192, cache
          assert str(cache.get("source_run_id")) == "42523463620", cache
          assert cache.get("corpus_sha256") == corpus.get("corpus_sha256"), (cache,corpus)
          assert cache.get("corpus_bytes") == corpus.get("text_bytes"), (cache,corpus)
          assert cache.get("evaluation_records_excluded") == corpus.get("evaluation_records_excluded"), (cache,corpus)
          assert cache.get("tokenizer_sha256") == os.environ["EXPECTED_TOKENIZER_SHA256"], cache
          print(json.dumps({
            "corpus_sha256":cache["corpus_sha256"],
            "token_count":cache["token_count"],
            "tokens_sha256":cache["tokens_sha256"],
            "tokenizer_sha256":cache["tokenizer_sha256"]
          },indent=2))
          PY

      - name: Build checkpoint-compatible 256-token config
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config=json.loads(Path("configs/ronin-10m.json").read_text())
          config["context_length"]=256
          Path("configs/ronin-10m-speed-256.json").write_text(json.dumps(config,indent=2)+chr(10))
          PY

      - name: Continue for 6,000 steps at half learning rate with denser validation
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
          OMP_PROC_BIND: CLOSE
          OMP_PLACES: CORES
        run: |
          set -euo pipefail
          python - <<'PY'
          import runpy,sys,torch
          torch.set_num_threads(2)
          torch.set_num_interop_threads(2)
          sys.argv=[
            "scripts/train.py",
            "--config","configs/ronin-10m-speed-256.json",
            "--tokens","token-cache/corpus-tokens.u16",
            "--token-manifest","token-cache/token-manifest.json",
            "--resume","parent-artifact-checkpoint-54000.pt",
            "--output-dir","runs/ronin-10m-60k-lr5e5",
            "--steps","6000",
            "--threads","2",
            "--batch-size","4",
            "--learning-rate","5e-5",
            "--warmup-steps","0",
            "--min-lr-ratio","1.0",
            "--checkpoint-every","1000",
            "--eval-batches","32",
          ]
          runpy.run_path("scripts/train.py",run_name="__main__")
          PY

      - name: Upload every completed recovery checkpoint even if a later step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ronin-10m-checkpoints-54k-to-60k-lr5e5-${{ github.run_id }}
          path: |
            runs/ronin-10m-60k-lr5e5/checkpoint-*.pt
            runs/ronin-10m-60k-lr5e5/SHA256SUMS
            runs/ronin-10m-60k-lr5e5/progress.json
          if-no-files-found: warn
          retention-days: 90

      - name: Verify final cumulative step and write recovery lineage
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          out=Path("runs/ronin-10m-60k-lr5e5")
          checkpoints=list(out.glob("checkpoint-*.pt"))
          if not checkpoints:
            raise SystemExit("No recoverable checkpoints were produced")
          latest=max(checkpoints,key=lambda p:int(re.search(r"checkpoint-(\\d+)",p.name).group(1)))
          step=int(re.search(r"checkpoint-(\\d+)",latest.name).group(1))
          assert step == 60000, {"latest_checkpoint":latest.name,"cumulative_steps":step}
          digest=hashlib.sha256(latest.read_bytes()).hexdigest()
          cache=json.loads(Path("token-cache/token-manifest.json").read_text())
          lineage={
            "source_run_id":43025252739,
            "parent_checkpoint":"checkpoint-54000.pt",
            "parent_checkpoint_sha256":"5eb84ddd7df2512336bf7d86f590eeaf0a8007d9057ecd05167bcd4d9f963d9d",
            "source_run_conclusion":"cancelled_after_checkpoint_56000",
            "corpus_source_run_id":42523463620,
            "token_cache_run_id":42890884432,
            "corpus_sha256":cache["corpus_sha256"],
            "tokenizer_sha256":cache["tokenizer_sha256"],
            "token_count":cache["token_count"],
            "steps_this_run":6000,
            "cumulative_steps":step,
            "latest_checkpoint":latest.name,
            "latest_checkpoint_sha256":digest,
            "training_config":{
              "context_length":256,"threads":2,"batch_size":4,
              "learning_rate":0.00005,"learning_rate_change":"halved_from_1e-4",
              "checkpoint_every":1000,"eval_batches":32,
              "tokenization_reused":True,"optimizer_state":"continued_from_54k"
            }
          }
          (out/"lineage.json").write_text(json.dumps(lineage,indent=2)+chr(10))
          print(json.dumps(lineage,indent=2))
          PY

      - name: Upload final 60k checkpoint and complete lineage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ronin-10m-chain-60k-lr5e5-${{ github.run_id }}
          path: |
            runs/ronin-10m-60k-lr5e5/checkpoint-*.pt
            runs/ronin-10m-60k-lr5e5/SHA256SUMS
            runs/ronin-10m-60k-lr5e5/progress.json
            runs/ronin-10m-60k-lr5e5/lineage.json
            token-cache/token-manifest.json
            configs/ronin-10m-speed-256.json
          if-no-files-found: warn
          retention-days: 90

# Starts from the hash-verified 54k checkpoint; halves LR and increases validation sampling.
