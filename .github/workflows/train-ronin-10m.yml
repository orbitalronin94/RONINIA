name: RONIN-10M — train 50k from scratch with 5k evaluations
on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Training steps"
        required: true
        default: "50000"
        type: string
      corpus_run_id:
        description: "Verified MINIRONIN unified corpus run"
        required: true
        default: "42679698690"
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: roninia-10m-from-scratch
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate training inputs
        env:
          STEPS: ${{ inputs.steps }}
          CORPUS_RUN_ID: ${{ inputs.corpus_run_id }}
        run: |
          set -euo pipefail
          [[ "$STEPS" =~ ^[1-9][0-9]*$ ]]
          [[ "$CORPUS_RUN_ID" =~ ^[0-9]+$ ]]
          test "$STEPS" -le 50000
      - name: Verify source MINIRONIN corpus run
        env:
          GH_TOKEN: ${{ github.token }}
          CORPUS_RUN_ID: ${{ inputs.corpus_run_id }}
        run: |
          set -euo pipefail
          run="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/orbitalronin94/MINIRONIN/actions/runs/$CORPUS_RUN_ID")"
          test "$(jq -r .status <<<"$run")" = "completed"
          test "$(jq -r .conclusion <<<"$run")" = "success"
          test "$(jq -r .head_branch <<<"$run")" = "main"
          echo "Verified MINIRONIN source run $CORPUS_RUN_ID"
      - name: Download full MINIRONIN corpus artifact directly
        uses: actions/download-artifact@v4
        with:
          name: minironin-unified-train-corpus-${{ inputs.corpus_run_id }}
          github-token: ${{ github.token }}
          repository: orbitalronin94/MINIRONIN
          run-id: ${{ inputs.corpus_run_id }}
          path: minironin-unified
      - name: Verify source artifact and disk capacity
        run: |
          set -euo pipefail
          test -s minironin-unified/train.jsonl.gz
          test -s minironin-unified/sources.json
          test -s minironin-unified/quality-report.json
          test -s minironin-unified/SHA256SUMS
          (cd minironin-unified && sha256sum -c SHA256SUMS)
          available=$(df --output=avail -k . | tail -1 | tr -d ' ')
          echo "Available disk: ${available} KiB"
          test "$available" -gt 3000000
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install tokenizers numpy
      - name: Prepare corpus (include synthetic, exclude evaluation)
        run: |
          python scripts/prepare_corpus.py --input-root minironin-unified \
            --output data/corpus/train.txt \
            --manifest data/corpus/corpus-manifest.json \
            --source-run-id "${{ inputs.corpus_run_id }}"
      - name: Verify imported corpus
        run: |
          test -s data/corpus/train.txt
          test -s data/corpus/corpus-manifest.json
          python - <<'PY'
          import json
          m=json.load(open("data/corpus/corpus-manifest.json"))
          assert m["records_total"] > 0
          assert m["synthetic_records_included"] > 0
          assert m["evaluation_records_excluded"] >= 0
          print(json.dumps(m,ensure_ascii=False,indent=2))
          PY
      - name: Restore tokenizer cache for this exact corpus
        id: tokenizer-cache
        uses: actions/cache@v4
        with:
          path: tokenizer/
          key: roninia-tokenizer-v1-${{ hashFiles('data/corpus/corpus-manifest.json') }}
      - name: Train BPE tokenizer with streaming progress
        if: steps.tokenizer-cache.outputs.cache-hit != 'true'
        timeout-minutes: 180
        run: |
          python scripts/train_tokenizer.py --input data/corpus/train.txt --output tokenizer \
            --progress-every-mib 256
      - name: Verify tokenizer and corpus identity
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest=json.loads(Path("tokenizer/manifest.json").read_text())
          actual=hashlib.sha256(Path("tokenizer/tokenizer.json").read_bytes()).hexdigest()
          assert manifest["vocab_size"] == 16384
          assert manifest["tokenizer_sha256"] == actual
          print(json.dumps(manifest, indent=2))
          PY
      - name: Upload reusable tokenizer artifact
        if: steps.tokenizer-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: roninia-tokenizer-${{ hashFiles('data/corpus/corpus-manifest.json') }}
          path: tokenizer/
          if-no-files-found: error
          retention-days: 90
      - name: Train model from random initialization with 5k checkpoints
        run: |
          python scripts/train.py --config configs/ronin-10m.json --corpus data/corpus/train.txt \
            --tokenizer tokenizer/tokenizer.json --steps "${{ inputs.steps }}" --threads 2 \
            --checkpoint-every 5000 --eval-batches 16
      - uses: actions/upload-artifact@v4
        with:
          name: ronin-10m-step-${{ inputs.steps }}
          path: |
            runs/ronin-10m/checkpoint-*.pt
            runs/ronin-10m/SHA256SUMS
            runs/ronin-10m/progress.json
            tokenizer/
            data/corpus/corpus-manifest.json
          if-no-files-found: error
          retention-days: 30
