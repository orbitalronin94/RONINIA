name: RONIN-10M — train from scratch
on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Training steps"
        required: true
        default: "1000"
        type: string
permissions:
  contents: read
concurrency:
  group: roninia-10m-from-scratch
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download prepared library artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: import-minironin-libraries.yml
          name: roninia-corpus
          path: data/corpus
          repo: orbitalronin94/RONINIA
          github_token: ${{ github.token }}
          workflow_conclusion: success
          if_no_artifact_found: fail
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install tokenizers
      - name: Verify imported corpus
        run: |
          test -s data/corpus/train.txt
          test -s data/corpus/corpus-manifest.json
          python -c 'import json; m=json.load(open("data/corpus/corpus-manifest.json")); assert m["records_total"]>0; print(m["records_total"], m["text_bytes"], m["corpus_sha256"])'
      - name: Train new BPE tokenizer (16,384)
        run: python scripts/train_tokenizer.py --input data/corpus/train.txt --output tokenizer
      - name: Train model from random initialization
        run: |
          python scripts/train.py --config configs/ronin-10m.json --corpus data/corpus/train.txt \
            --tokenizer tokenizer/tokenizer.json --steps "${{ inputs.steps }}" --threads 2
      - uses: actions/upload-artifact@v4
        with:
          name: ronin-10m-step-${{ inputs.steps }}
          path: |
            runs/ronin-10m/
            tokenizer/
            data/corpus/corpus-manifest.json
          if-no-files-found: error
          retention-days: 30
