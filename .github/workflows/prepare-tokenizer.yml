name: RONIN-IA — prepare reusable 8k tokenizer
on:
  workflow_dispatch:
    inputs:
      corpus_run_id:
        description: "Verified ~777 MB MINIRONIN training corpus run"
        required: true
        default: "42523463620"
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: roninia-tokenizer-preparation
  cancel-in-progress: false
jobs:
  tokenizer:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate and verify source run
        env:
          GH_TOKEN: ${{ github.token }}
          CORPUS_RUN_ID: ${{ inputs.corpus_run_id }}
        run: |
          set -euo pipefail
          [[ "$CORPUS_RUN_ID" =~ ^[0-9]+$ ]]
          run="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/orbitalronin94/MINIRONIN/actions/runs/$CORPUS_RUN_ID")"
          test "$(jq -r .name <<<"$run")" = "MINIRONIN — construir corpus unificado de entrenamiento"
          test "$(jq -r .status <<<"$run")" = "completed"
          test "$(jq -r .conclusion <<<"$run")" = "success"
          test "$(jq -r .head_branch <<<"$run")" = "main"
          echo "Verified source run $CORPUS_RUN_ID"
      - name: Download full unified corpus
        uses: actions/download-artifact@v4
        with:
          name: minironin-unified-train-corpus-${{ inputs.corpus_run_id }}
          github-token: ${{ github.token }}
          repository: orbitalronin94/MINIRONIN
          run-id: ${{ inputs.corpus_run_id }}
          path: minironin-unified
      - name: Verify archive and available disk
        run: |
          set -euo pipefail
          test -s minironin-unified/train.jsonl.gz
          test -s minironin-unified/SHA256SUMS
          (cd minironin-unified && sha256sum -c SHA256SUMS)
          available=$(df --output=avail -k . | tail -1 | tr -d ' ')
          echo "Available disk: ${available} KiB"
          test "$available" -gt 3000000
      - name: Install tokenizer dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install tokenizers
      - name: Prepare exact train-only corpus
        run: |
          python scripts/prepare_corpus.py --input-root minironin-unified \
            --output data/corpus/train.txt --manifest data/corpus/corpus-manifest.json \
            --source-run-id "${{ inputs.corpus_run_id }}"
      - name: Verify prepared corpus
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("data/corpus/corpus-manifest.json").read_text())
          assert m["records_total"] > 0
          assert m["evaluation_records_excluded"] >= 0
          assert Path("data/corpus/train.txt").stat().st_size == m["text_bytes"]
          print(json.dumps(m, ensure_ascii=False, indent=2))
          PY
      - name: Train 8k tokenizer with progress
        timeout-minutes: 300
        run: |
          python scripts/train_tokenizer.py --input data/corpus/train.txt \
            --output tokenizer --corpus-manifest data/corpus/corpus-manifest.json \
            --vocab-size 8192 --progress-every-mib 64
      - name: Verify tokenizer and corpus fingerprint
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          corpus=json.loads(Path("data/corpus/corpus-manifest.json").read_text())
          tok=json.loads(Path("tokenizer/manifest.json").read_text())
          digest=hashlib.sha256(Path("tokenizer/tokenizer.json").read_bytes()).hexdigest()
          assert tok["vocab_size"] == 8192
          assert tok["tokenizer_sha256"] == digest
          assert tok["corpus_sha256"] == corpus["corpus_sha256"]
          assert tok["source_corpus_run_id"] == corpus["source_run_id"]
          assert tok["evaluation_records_excluded"] == corpus["evaluation_records_excluded"]
          print(json.dumps(tok, indent=2))
          PY
      - name: Upload reusable tokenizer artifact
        uses: actions/upload-artifact@v4
        with:
          name: roninia-tokenizer-8k-${{ hashFiles('data/corpus/corpus-manifest.json') }}
          path: tokenizer/
          if-no-files-found: error
          retention-days: 90
