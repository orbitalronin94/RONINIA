name: RONIN-10M — prepare Spanish + synthetic preloaded token cache

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-spanish-synthetic-cache.yml"
      - "scripts/prepare_spanish_synthetic_corpus.py"
      - "scripts/tokenize_corpus.py"
  pull_request:
    paths:
      - ".github/workflows/prepare-spanish-synthetic-cache.yml"
      - "scripts/prepare_spanish_synthetic_corpus.py"
      - "scripts/tokenize_corpus.py"
      - "scripts/train.py"
      - "tests/test_spanish_synthetic_corpus.py"
  workflow_dispatch:
    inputs:
      corpus_run_id:
        description: "Successful latest MINIRONIN unified corpus run on main"
        required: true
        default: "43171599026"
        type: string
      tokenizer_run_id:
        description: "Existing compatible RONINIA 8k tokenizer run"
        required: true
        default: "42849436025"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: roninia-spanish-synthetic-cache
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile scripts/prepare_spanish_synthetic_corpus.py scripts/tokenize_corpus.py scripts/train.py
      - run: python -m pip install pytest
      - run: pytest -q tests/test_spanish_synthetic_corpus.py

  prepare:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CORPUS_RUN_ID: ${{ inputs.corpus_run_id || '43171599026' }}
      TOKENIZER_RUN_ID: ${{ inputs.tokenizer_run_id || '42849436025' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate successful source corpus run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CORPUS_RUN_ID" =~ ^[0-9]+$ ]]
          for attempt in $(seq 1 360); do
            run="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/orbitalronin94/MINIRONIN/actions/runs/$CORPUS_RUN_ID")"
            status="$(jq -r .status <<<"$run")"
            conclusion="$(jq -r .conclusion <<<"$run")"
            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success"
              break
            fi
            echo "Source corpus run $CORPUS_RUN_ID is $status; waiting (attempt $attempt/360)."
            sleep 30
          done
          test "$(jq -r .name <<<"$run")" = "MINIRONIN — construir corpus unificado de entrenamiento"
          test "$(jq -r .status <<<"$run")" = "completed"
          test "$(jq -r .conclusion <<<"$run")" = "success"
          test "$(jq -r .head_branch <<<"$run")" = "main"

      - name: Download verified MINIRONIN unified corpus
        uses: actions/download-artifact@v4
        with:
          name: minironin-unified-train-corpus-${{ env.CORPUS_RUN_ID }}
          github-token: ${{ github.token }}
          repository: orbitalronin94/MINIRONIN
          run-id: ${{ env.CORPUS_RUN_ID }}
          path: minironin-unified

      - name: Verify source corpus checksums and provenance
        run: |
          set -euo pipefail
          test -s minironin-unified/train.jsonl.gz
          test -s minironin-unified/sources.json
          test -s minironin-unified/quality-report.json
          test -s minironin-unified/SHA256SUMS
          (cd minironin-unified && sha256sum -c SHA256SUMS)
          available=$(df --output=avail -k . | tail -1 | tr -d ' ')
          echo "Available disk: ${available} KiB"
          test "$available" -gt 5000000
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("minironin-unified/quality-report.json").read_text())
          sources=json.loads(Path("minironin-unified/sources.json").read_text())
          assert report["record_count"] > 0
          assert sources["record_count"] == report["record_count"]
          assert report.get("synthetic_included") is True
          print(json.dumps({"source_records":report["record_count"],"datasets":len(report.get("datasets",{})),"source_files":report.get("source_files")},ensure_ascii=False,indent=2))
          PY

      - name: Checkout pinned HERETIC Drosophila synthetic candidate
        uses: actions/checkout@v4
        with:
          repository: orbitalronin94/HERETIC-RONIN
          ref: a75fb8d35d099efa04353918ee7b73ad2a65cc75
          path: heretic-drosophila

      - name: Verify and add all 50k Drosophila synthetic train candidates
        run: |
          set -euo pipefail
          src="heretic-drosophila/data/drosophila"
          dst="minironin-unified/drosophila"
          mkdir -p "$dst/parts"
          cp "$src"/parts/*.jsonl "$dst/parts/"
          cp "$src/README_01301_51300.md" "$dst/"
          cp "$src/CURATION_QUEUE_2026-11-06.md" "$dst/"
          cp heretic-drosophila/LICENSE "$dst/LICENSE"
          python - <<'PY'
          import hashlib,json
          from collections import Counter
          from pathlib import Path
          root=Path("minironin-unified/drosophila")
          shards=sorted((root/"parts").glob("*.jsonl"))
          assert len(shards)==10, len(shards)
          ids=set()
          status_counts=Counter()
          language_counts=Counter()
          reports=[]
          dataset_hash=hashlib.sha256()
          total=0
          for shard in shards:
              shard_hash=hashlib.sha256()
              rows=0
              with shard.open("rb") as stream:
                  for line_no,raw in enumerate(stream,1):
                      if not raw.strip(): continue
                      shard_hash.update(raw)
                      dataset_hash.update(raw)
                      row=json.loads(raw)
                      assert isinstance(row,dict), (shard,line_no)
                      row_id=row.get("id")
                      assert row_id is not None, (shard,line_no,"missing id")
                      row_id=str(row_id)
                      assert row_id not in ids, f"duplicate Drosophila id: {row_id}"
                      ids.add(row_id)
                      status=str(row.get("status") or row.get("split") or "unmarked").strip().casefold()
                      assert status not in {"test","eval","evaluation","benchmark","holdout","validation","dev"}, (shard,line_no,status)
                      status_counts[status]+=1
                      language=str(row.get("language") or row.get("lang") or "unmarked").strip().casefold()
                      language_counts[language]+=1
                      rows+=1
                      total+=1
              assert rows==5000, (shard.name,rows)
              reports.append({"file":shard.name,"rows":rows,"bytes":shard.stat().st_size,"sha256":shard_hash.hexdigest()})
          assert total==50000, total
          manifest={
              "dataset":"Drosophila 01301-51300",
              "repository":"orbitalronin94/HERETIC-RONIN",
              "commit":"a75fb8d35d099efa04353918ee7b73ad2a65cc75",
              "source_path":"data/drosophila/parts",
              "license":"MIT",
              "synthetic":True,
              "rows":total,
              "unique_ids":len(ids),
              "status_counts":dict(status_counts),
              "language_counts":dict(language_counts),
              "dataset_sha256":dataset_hash.hexdigest(),
              "shards":reports,
              "quality_status":"train_candidate_not_gold",
              "holdout":False,
              "note":"50 procedural task families with 1,000 parameterizations each across ten domains; included because all synthetic datasets were requested, but not gold and not 50,000 independent capabilities."
          }
          (root/"manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+chr(10),encoding="utf-8")
          (Path("minironin-unified")/"external-sources.json").write_text(json.dumps({"sources":[manifest]},ensure_ascii=False,indent=2)+chr(10),encoding="utf-8")
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Install tokenizer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy tokenizers

      - name: Build exact synthetic + Spanish-only corpus projection
        run: |
          python scripts/prepare_spanish_synthetic_corpus.py \
            --input-root minironin-unified \
            --output data/corpus/train.txt \
            --manifest data/corpus/corpus-manifest.json \
            --source-run-id "${{ env.CORPUS_RUN_ID }}"

      - name: Verify corpus selection and language boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("data/corpus/corpus-manifest.json").read_text())
          counts=m["records"]
          assert m["selection_policy_version"]==2
          assert m["selection_policy"]=="all_synthetic_plus_verified_spanish_non_synthetic_target_language_precedence"
          assert counts["synthetic_included"] > 0
          assert counts["spanish_source_included"] > 0
          assert counts["records_included"] == counts["synthetic_included"] + counts["spanish_source_included"]
          assert counts["evaluation_excluded"] >= 0
          assert Path("data/corpus/train.txt").stat().st_size == m["text_bytes"]
          print(json.dumps(m,ensure_ascii=False,indent=2))
          PY

      - name: Release the large source archive after the filtered corpus is verified
        run: rm -rf minironin-unified

      - name: Verify existing 8k tokenizer run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TOKENIZER_RUN_ID" =~ ^[0-9]+$ ]]
          run="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/orbitalronin94/RONINIA/actions/runs/$TOKENIZER_RUN_ID")"
          test "$(jq -r .status <<<"$run")" = "completed"
          test "$(jq -r .conclusion <<<"$run")" = "success"
          test "$(jq -r .head_branch <<<"$run")" = "main"

      - name: Download existing compatible 8k tokenizer (no retraining)
        uses: actions/download-artifact@v4
        with:
          name: roninia-tokenizer-8k-0f83e1bf4ca6aa7c08cb412d3bf48a5a7de961d012fd4abfe6f648e7ed029617
          github-token: ${{ github.token }}
          repository: orbitalronin94/RONINIA
          run-id: ${{ env.TOKENIZER_RUN_ID }}
          path: tokenizer

      - name: Verify tokenizer identity and build uint16 cache once
        run: |
          set -euo pipefail
          test -s tokenizer/tokenizer.json
          test -s tokenizer/manifest.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          manifest=json.loads(Path("tokenizer/manifest.json").read_text())
          actual=hashlib.sha256(Path("tokenizer/tokenizer.json").read_bytes()).hexdigest()
          assert manifest["vocab_size"]==8192
          assert manifest["tokenizer_sha256"]==actual
          assert actual=="605834d0d1deea545518be54ae0936060845107b906172f6628d0ff9520e57a4"
          print({"vocab_size":manifest["vocab_size"],"tokenizer_sha256":actual,"original_tokenizer_corpus_sha256":manifest.get("corpus_sha256")})
          PY
          python scripts/tokenize_corpus.py \
            --corpus data/corpus/train.txt \
            --tokenizer tokenizer/tokenizer.json \
            --corpus-manifest data/corpus/corpus-manifest.json \
            --output token-cache/corpus-tokens.u16 \
            --manifest token-cache/token-manifest.json
          (cd token-cache && sha256sum corpus-tokens.u16 token-manifest.json > SHA256SUMS)

      - name: Verify preloaded cache and selection provenance
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          cache=json.loads(Path("token-cache/token-manifest.json").read_text())
          corpus=json.loads(Path("data/corpus/corpus-manifest.json").read_text())
          assert cache["schema"]=="roninia-token-cache-v1" and cache["dtype"]=="uint16"
          assert cache["vocab_size"]==8192
          assert cache["corpus_sha256"]==corpus["corpus_sha256"]
          assert cache["selection_policy_version"]==2
          assert cache["selection_policy"]==corpus["selection_policy"]
          assert cache["synthetic_records_included"]>0
          assert cache["spanish_source_records_included"]>0
          assert Path("token-cache/corpus-tokens.u16").stat().st_size==cache["tokens_bytes"]
          print(json.dumps({k:cache.get(k) for k in ("token_count","tokens_bytes","corpus_sha256","tokenizer_sha256","selection_policy","synthetic_records_included","spanish_source_records_included","excluded_non_synthetic_non_spanish","excluded_non_synthetic_unverified_language")},ensure_ascii=False,indent=2))
          PY

      - name: Remove temporary text and tokenizer files
        run: rm -rf data/corpus/train.txt tokenizer

      - name: Upload reusable pretokenized Spanish + synthetic corpus
        uses: actions/upload-artifact@v4
        with:
          name: roninia-spanish-synthetic-token-cache-${{ github.run_id }}
          path: |
            token-cache/corpus-tokens.u16
            token-cache/token-manifest.json
            token-cache/SHA256SUMS
            data/corpus/corpus-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
