name: RONIN-10M — continue 100k to 137500 (+37500, verified parent)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/train-100k-to-137500.yml"
  pull_request:
    types: [closed]

permissions:
  actions: read
  contents: read

concurrency:
  group: roninia-10m-continue-100k-to-137500
  cancel-in-progress: false

jobs:
  train:
    if: github.event_name == 'push' || (github.event.pull_request.merged == true && github.event.pull_request.title == 'Launch RONINIA 100k to 137.5k training')
    runs-on: ubuntu-latest
    timeout-minutes: 420
    env:
      PARENT_RUN_ID: "43098824973"
      PARENT_ARTIFACT: "ronin-10m-chain-100k-lr25e6-43098824973"
      TOKEN_CACHE_RUN_ID: "42890884432"
      EXPECTED_PARENT_SHA256: "5a3ded6f409b008690b1ff18b279aa4609d45ab320cd60130fea6f18121b6f79"
      EXPECTED_TOKENIZER_SHA256: "605834d0d1deea545518be54ae0936060845107b906172f6628d0ff9520e57a4"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy tokenizers

      - name: Verify successful 100k parent run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/orbitalronin94/RONINIA/actions/runs/$PARENT_RUN_ID")"
          test "$(jq -r .status <<<"$run")" = "completed"
          test "$(jq -r .conclusion <<<"$run")" = "success"
          test "$(jq -r .head_branch <<<"$run")" = "main"

      - name: Download immutable 100k checkpoint chain
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PARENT_ARTIFACT }}
          github-token: ${{ github.token }}
          repository: orbitalronin94/RONINIA
          run-id: ${{ env.PARENT_RUN_ID }}
          path: parent-artifact

      - name: Resolve and verify exact 100k checkpoint and lineage
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find parent-artifact -type f -name 'checkpoint-100000.pt' -size +0c)
          if [ "${#candidates[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one checkpoint-100000.pt, found ${#candidates[@]}"
            find parent-artifact -maxdepth 4 -type f -printf '%p %s bytes\\n'
            exit 1
          fi
          cp "${candidates[0]}" checkpoint-parent-100000.pt
          actual="$(sha256sum checkpoint-parent-100000.pt | awk '{print $1}')"
          echo "Parent checkpoint SHA-256: $actual"
          test "$actual" = "$EXPECTED_PARENT_SHA256"
          python - <<'PY'
          import torch
          p=torch.load("checkpoint-parent-100000.pt",map_location="cpu",weights_only=False)
          assert int(p.get("completed_steps",-1)) == 100000, p.get("completed_steps")
          assert p.get("tokenizer_sha256") == "605834d0d1deea545518be54ae0936060845107b906172f6628d0ff9520e57a4"
          print({"completed_steps":p["completed_steps"],"validation_loss":p.get("validation_loss"),"parameter_count":p.get("parameter_count"),"corpus_sha256":p.get("corpus_sha256"),"tokenizer_sha256":p.get("tokenizer_sha256")})
          PY

      - name: Download existing full-corpus token cache (no retokenization)
        uses: actions/download-artifact@v4
        with:
          name: roninia-token-cache-${{ env.TOKEN_CACHE_RUN_ID }}
          github-token: ${{ github.token }}
          repository: orbitalronin94/RONINIA
          run-id: ${{ env.TOKEN_CACHE_RUN_ID }}
          path: token-cache

      - name: Verify cache identity, tokenizer and hashes
        run: |
          set -euo pipefail
          test -s token-cache/corpus-tokens.u16
          test -s token-cache/token-manifest.json
          test -s token-cache/SHA256SUMS
          (cd token-cache && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import json
          from pathlib import Path
          cache=json.loads(Path("token-cache/token-manifest.json").read_text())
          assert cache.get("schema") == "roninia-token-cache-v1", cache
          assert cache.get("dtype") == "uint16", cache
          assert cache.get("vocab_size") == 8192, cache
          assert str(cache.get("source_run_id")) == "42523463620", cache
          assert cache.get("tokenizer_sha256") == "605834d0d1deea545518be54ae0936060845107b906172f6628d0ff9520e57a4", cache
          print(json.dumps({k:cache.get(k) for k in ("source_run_id","corpus_sha256","token_count","tokens_sha256","tokenizer_sha256")},indent=2))
          PY

      - name: Build checkpoint-compatible 256-token config
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config=json.loads(Path("configs/ronin-10m.json").read_text())
          config["context_length"]=256
          Path("configs/ronin-10m-speed-256.json").write_text(json.dumps(config,indent=2)+chr(10))
          PY

      - name: Continue training for exactly 37,500 additional steps
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
          OMP_PROC_BIND: CLOSE
          OMP_PLACES: CORES
        run: |
          set -euo pipefail
          python - <<'PY'
          import runpy,sys,torch
          torch.set_num_threads(2)
          torch.set_num_interop_threads(2)
          sys.argv=[
            "scripts/train.py",
            "--config","configs/ronin-10m-speed-256.json",
            "--tokens","token-cache/corpus-tokens.u16",
            "--token-manifest","token-cache/token-manifest.json",
            "--resume","checkpoint-parent-100000.pt",
            "--output-dir","runs/ronin-10m-137500-from-100k",
            "--steps","37500",
            "--threads","2",
            "--batch-size","4",
            "--learning-rate","2.5e-5",
            "--warmup-steps","0",
            "--min-lr-ratio","1.0",
            "--checkpoint-every","1000",
            "--eval-batches","32",
          ]
          runpy.run_path("scripts/train.py",run_name="__main__")
          PY

      - name: Upload every recoverable checkpoint even if a later step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ronin-10m-checkpoints-100k-to-137500-${{ github.run_id }}
          path: |
            runs/ronin-10m-137500-from-100k/checkpoint-*.pt
            runs/ronin-10m-137500-from-100k/SHA256SUMS
            runs/ronin-10m-137500-from-100k/progress.json
          if-no-files-found: warn
          retention-days: 90

      - name: Verify cumulative 137500 checkpoint and write lineage
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          out=Path("runs/ronin-10m-137500-from-100k")
          checkpoints=list(out.glob("checkpoint-*.pt"))
          if not checkpoints:
            raise SystemExit("No recoverable checkpoints were produced")
          latest=max(checkpoints,key=lambda p:int(re.search(r"checkpoint-(\d+)",p.name).group(1)))
          step=int(re.search(r"checkpoint-(\d+)",latest.name).group(1))
          assert step == 137500, {"latest_checkpoint":latest.name,"cumulative_steps":step}
          digest=hashlib.sha256(latest.read_bytes()).hexdigest()
          cache=json.loads(Path("token-cache/token-manifest.json").read_text())
          lineage={
            "parent_run_id":43098824973,
            "parent_artifact":"ronin-10m-chain-100k-lr25e6-43098824973",
            "parent_checkpoint":"checkpoint-100000.pt",
            "parent_checkpoint_sha256":"5a3ded6f409b008690b1ff18b279aa4609d45ab320cd60130fea6f18121b6f79",
            "token_cache_run_id":42890884432,
            "corpus_sha256":cache["corpus_sha256"],
            "tokenizer_sha256":cache["tokenizer_sha256"],
            "token_count":cache["token_count"],
            "steps_this_run":37500,
            "cumulative_steps":step,
            "latest_checkpoint":latest.name,
            "latest_checkpoint_sha256":digest,
            "training_config":{"context_length":256,"threads":2,"batch_size":4,"learning_rate":0.000025,"checkpoint_every":1000,"eval_batches":32,"tokenization_reused":True}
          }
          (out/"lineage.json").write_text(json.dumps(lineage,indent=2)+chr(10))
          print(json.dumps(lineage,indent=2))
          PY

      - name: Upload final checkpoint and complete recovery lineage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ronin-10m-chain-137500-${{ github.run_id }}
          path: |
            runs/ronin-10m-137500-from-100k/checkpoint-*.pt
            runs/ronin-10m-137500-from-100k/SHA256SUMS
            runs/ronin-10m-137500-from-100k/progress.json
            runs/ronin-10m-137500-from-100k/lineage.json
            token-cache/token-manifest.json
            configs/ronin-10m-speed-256.json
          if-no-files-found: warn
          retention-days: 90

# Exact 100k parent and existing corpus/tokenizer cache are hash-verified; no retokenization.
