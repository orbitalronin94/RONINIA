name: RONIN-10M — continue 40k to 50k on full MINIRONIN corpus

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: roninia-10m-continue-40000-to-50000
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    env:
      PARENT_RUN_ID: "42994415440"
      CORPUS_RUN_ID: "42523463620"
      TOKEN_CACHE_RUN_ID: "42890884432"
      EXPECTED_PARENT_SHA256: "9da6ea9b294665213114858b90f44168d940c36fb54cdb4612186a896bda7698"
      EXPECTED_TOKENIZER_SHA256: "605834d0d1deea545518be54ae0936060845107b906172f6628d0ff9520e57a4"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU checkpoint and training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy tokenizers

      - name: Verify successful 40k parent training run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/orbitalronin94/RONINIA/actions/runs/$PARENT_RUN_ID")"
          test "$(jq -r .status <<<"$run")" = "completed"
          test "$(jq -r .conclusion <<<"$run")" = "success"
          test "$(jq -r .head_branch <<<"$run")" = "main"

      - name: Download immutable 40k checkpoint chain
        uses: actions/download-artifact@v4
        with:
          name: ronin-10m-chain-40k-42994415440
          github-token: ${{ github.token }}
          repository: orbitalronin94/RONINIA
          run-id: ${{ env.PARENT_RUN_ID }}
          path: parent-artifact

      - name: Resolve and verify exact 40k checkpoint
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find parent-artifact -type f -name 'checkpoint-40000.pt' -size +0c)
          if [ "${#candidates[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one checkpoint-40000.pt, found ${#candidates[@]}"
            exit 1
          fi
          cp "${candidates[0]}" parent-artifact/checkpoint-parent.pt
          actual="$(sha256sum parent-artifact/checkpoint-parent.pt | awk '{print $1}')"
          echo "Parent checkpoint SHA-256: $actual"
          test "$actual" = "$EXPECTED_PARENT_SHA256"
          python - <<'PY'
          import torch
          p=torch.load("parent-artifact/checkpoint-parent.pt",map_location="cpu",weights_only=False)
          assert int(p.get("completed_steps",-1)) == 40000, p.get("completed_steps")
          print("Verified exact parent checkpoint at 40,000 cumulative steps.")
          PY

      - name: Verify full MINIRONIN corpus source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/orbitalronin94/MINIRONIN/actions/runs/$CORPUS_RUN_ID")"
          test "$(jq -r .status <<<"$run")" = "completed"
          test "$(jq -r .conclusion <<<"$run")" = "success"
          test "$(jq -r .head_branch <<<"$run")" = "main"

      - name: Download the complete prebuilt MINIRONIN corpus artifact
        uses: actions/download-artifact@v4
        with:
          name: minironin-unified-train-corpus-${{ env.CORPUS_RUN_ID }}
          github-token: ${{ github.token }}
          repository: orbitalronin94/MINIRONIN
          run-id: ${{ env.CORPUS_RUN_ID }}
          path: minironin-unified

      - name: Verify complete corpus artifact and prepared-corpus identity
        run: |
          set -euo pipefail
          test -s minironin-unified/train.jsonl.gz
          test -s minironin-unified/sources.json
          test -s minironin-unified/quality-report.json
          test -s minironin-unified/SHA256SUMS
          (cd minironin-unified && sha256sum -c SHA256SUMS)
          available=$(df --output=avail -k . | tail -1 | tr -d ' ')
          echo "Available disk: ${available} KiB"
          test "$available" -gt 3000000
          python scripts/prepare_corpus.py --input-root minironin-unified \
            --output data/corpus/train.txt --manifest data/corpus/corpus-manifest.json \
            --source-run-id "$CORPUS_RUN_ID"
          test -s data/corpus/train.txt

      - name: Download existing pretokenized full-corpus cache (no tokenization)
        uses: actions/download-artifact@v4
        with:
          name: roninia-token-cache-${{ env.TOKEN_CACHE_RUN_ID }}
          github-token: ${{ github.token }}
          repository: orbitalronin94/RONINIA
          run-id: ${{ env.TOKEN_CACHE_RUN_ID }}
          path: token-cache

      - name: Verify cache is exactly bound to the complete corpus and tokenizer
        run: |
          set -euo pipefail
          test -s token-cache/corpus-tokens.u16
          test -s token-cache/token-manifest.json
          test -s token-cache/SHA256SUMS
          (cd token-cache && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import json
          from pathlib import Path
          corpus=json.loads(Path("data/corpus/corpus-manifest.json").read_text())
          cache=json.loads(Path("token-cache/token-manifest.json").read_text())
          assert cache.get("schema") == "roninia-token-cache-v1", cache
          assert cache.get("dtype") == "uint16", cache
          assert cache.get("vocab_size") == 8192, cache
          assert str(cache.get("source_run_id")) == "42523463620", cache
          assert cache.get("corpus_sha256") == corpus.get("corpus_sha256"), (cache,corpus)
          assert cache.get("corpus_bytes") == corpus.get("text_bytes"), (cache,corpus)
          assert cache.get("evaluation_records_excluded") == corpus.get("evaluation_records_excluded"), (cache,corpus)
          assert cache.get("tokenizer_sha256") == "605834d0d1deea545518be54ae0936060845107b906172f6628d0ff9520e57a4", cache
          print(json.dumps({
            "source_corpus_run_id":cache["source_run_id"],
            "corpus_sha256":cache["corpus_sha256"],
            "corpus_bytes":cache["corpus_bytes"],
            "token_count":cache["token_count"],
            "tokens_sha256":cache["tokens_sha256"],
            "tokenizer_sha256":cache["tokenizer_sha256"],
            "evaluation_records_excluded":cache["evaluation_records_excluded"]
          },indent=2))
          PY

      - name: Build checkpoint-compatible 256-token config
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config=json.loads(Path("configs/ronin-10m.json").read_text())
          config["context_length"]=256
          Path("configs/ronin-10m-speed-256.json").write_text(json.dumps(config,indent=2)+chr(10))
          PY

      - name: Continue training for 10,000 additional steps on full-corpus token cache
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
          OMP_PROC_BIND: CLOSE
          OMP_PLACES: CORES
        run: |
          set -euo pipefail
          python - <<'PY'
          import runpy,sys,torch
          torch.set_num_threads(2)
          torch.set_num_interop_threads(2)
          sys.argv=[
            "scripts/train.py",
            "--config","configs/ronin-10m-speed-256.json",
            "--tokens","token-cache/corpus-tokens.u16",
            "--token-manifest","token-cache/token-manifest.json",
            "--resume","parent-artifact/checkpoint-parent.pt",
            "--output-dir","runs/ronin-10m-50k",
            "--steps","10000",
            "--threads","2",
            "--batch-size","4",
            "--learning-rate","1e-4",
            "--warmup-steps","0",
            "--min-lr-ratio","1.0",
            "--checkpoint-every","1000",
            "--eval-batches","8",
          ]
          runpy.run_path("scripts/train.py",run_name="__main__")
          PY

      - name: Upload every completed checkpoint even if a later step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ronin-10m-checkpoints-50k-${{ github.run_id }}
          path: |
            runs/ronin-10m-50k/checkpoint-*.pt
            runs/ronin-10m-50k/SHA256SUMS
            runs/ronin-10m-50k/progress.json
          if-no-files-found: warn
          retention-days: 90

      - name: Verify final cumulative step and write recovery lineage
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          out=Path("runs/ronin-10m-50k")
          checkpoints=list(out.glob("checkpoint-*.pt"))
          if not checkpoints:
            raise SystemExit("No recoverable checkpoints were produced")
          latest=max(checkpoints,key=lambda p:int(re.search(r"checkpoint-(\d+)",p.name).group(1)))
          step=int(re.search(r"checkpoint-(\d+)",latest.name).group(1))
          assert step == 50000, {"latest_checkpoint":latest.name,"cumulative_steps":step}
          digest=hashlib.sha256(latest.read_bytes()).hexdigest()
          cache=json.loads(Path("token-cache/token-manifest.json").read_text())
          lineage={
            "parent_run_id":42994415440,
            "parent_checkpoint":"checkpoint-40000.pt",
            "parent_checkpoint_sha256":"9da6ea9b294665213114858b90f44168d940c36fb54cdb4612186a896bda7698",
            "corpus_source_run_id":42523463620,
            "token_cache_run_id":42890884432,
            "corpus_sha256":cache["corpus_sha256"],
            "tokenizer_sha256":cache["tokenizer_sha256"],
            "token_count":cache["token_count"],
            "steps_this_run":10000,
            "cumulative_steps":step,
            "latest_checkpoint":latest.name,
            "latest_checkpoint_sha256":digest,
            "training_config":{
              "context_length":256,"threads":2,"batch_size":4,
              "learning_rate":0.0001,"checkpoint_every":1000,
              "eval_batches":8,"tokenization_reused":True
            }
          }
          (out/"lineage.json").write_text(json.dumps(lineage,indent=2)+chr(10))
          print(json.dumps(lineage,indent=2))
          PY

      - name: Upload final checkpoint and complete recovery lineage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ronin-10m-chain-50k-${{ github.run_id }}
          path: |
            runs/ronin-10m-50k/checkpoint-*.pt
            runs/ronin-10m-50k/SHA256SUMS
            runs/ronin-10m-50k/progress.json
            runs/ronin-10m-50k/lineage.json
            token-cache/token-manifest.json
            configs/ronin-10m-speed-256.json
          if-no-files-found: warn
          retention-days: 90

# Parent checkpoint and full-corpus token cache are hash-verified; no retokenization is performed.
