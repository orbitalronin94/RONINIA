name: RONIN-10M — 10k inference holdout (same 100-question benchmark)

on:
  workflow_dispatch:
    inputs:
      train_run_id:
        description: "Successful training run ID (artifact ronin-10m-chain-RUN_ID)"
        required: true
        type: string
      tokenizer_run_id:
        description: "Run ID containing the exact tokenizer artifact"
        required: true
        default: "42849436025"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: roninia-checkpoint-10000-holdout
  cancel-in-progress: false

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Validate source training run
        env:
          GH_TOKEN: ${{ github.token }}
          TRAIN_RUN_ID: ${{ inputs.train_run_id }}
        run: |
          set -euo pipefail
          [[ "$TRAIN_RUN_ID" =~ ^[0-9]+$ ]]
          run="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/orbitalronin94/RONINIA/actions/runs/$TRAIN_RUN_ID")"
          test "$(jq -r .status <<<"$run")" = "completed"
          test "$(jq -r .conclusion <<<"$run")" = "success"
          echo "Verified source training run $TRAIN_RUN_ID"

      - name: Download 10k checkpoint artifact
        uses: actions/download-artifact@v4
        with:
          name: ronin-10m-chain-${{ inputs.train_run_id }}
          github-token: ${{ github.token }}
          repository: orbitalronin94/RONINIA
          run-id: ${{ inputs.train_run_id }}
          path: trained

      - name: Verify checkpoint and lineage
        id: checkpoint
        run: |
          set -euo pipefail
          checkpoint="$(find trained -type f -name 'checkpoint-10000.pt' -print -quit)"
          test -n "$checkpoint"
          test -s "$checkpoint"
          sums="$(find trained -type f -name SHA256SUMS -print -quit)"
          test -n "$sums"
          (cd "$(dirname "$sums")" && sha256sum -c SHA256SUMS)
          echo "path=$checkpoint" >> "$GITHUB_OUTPUT"
          sha256sum "$checkpoint"
          python - "$checkpoint" <<'PY'
          import sys, torch
          p=torch.load(sys.argv[1], map_location="cpu", weights_only=False)
          assert int(p.get("completed_steps", -1)) == 10000, p.get("completed_steps")
          print("Verified completed_steps=10000")
          PY

      - name: Download exact tokenizer used by training
        uses: actions/download-artifact@v4
        with:
          name: roninia-tokenizer-8k-0f83e1bf4ca6aa7c08cb412d3bf48a5a7de961d012fd4abfe6f648e7ed029617
          github-token: ${{ github.token }}
          repository: orbitalronin94/RONINIA
          run-id: ${{ inputs.tokenizer_run_id }}
          path: tokenizer

      - name: Download immutable 100-question holdout
        run: |
          set -euo pipefail
          mkdir -p benchmarks
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/orbitalronin94/MINIRONIN/main/benchmarks/inference-holdout-v1.jsonl \
            -o benchmarks/inference-holdout-v1.jsonl
          test "$(grep -cve '^$' benchmarks/inference-holdout-v1.jsonl)" -eq 100
          echo "3cd8c1eb3142ebf9c6cc17d2e19353be3472d61ac7b7cfb6de0cbb233cf4a535  benchmarks/inference-holdout-v1.jsonl" | sha256sum -c -

      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install tokenizers numpy

      - name: Generate 100 answers from checkpoint 10000
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python scripts/checkpoint_holdout.py \
            --checkpoint "${{ steps.checkpoint.outputs.path }}" \
            --tokenizer tokenizer/tokenizer.json \
            --holdout benchmarks/inference-holdout-v1.jsonl \
            --output-dir runs/checkpoint-10000-holdout \
            --expected-steps 10000 \
            --threads 2 --max-new-tokens 32 --max-new-bytes 128

      - name: Verify identical benchmark protocol
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("runs/checkpoint-10000-holdout/checkpoint-10000-holdout-100.json").read_text())
          assert result["completed_steps"] == 10000
          assert result["holdout_count"] == 100
          assert result["holdout_sha256"] == "3cd8c1eb3142ebf9c6cc17d2e19353be3472d61ac7b7cfb6de0cbb233cf4a535"
          assert result["generation"]["threads"] == 2
          assert result["generation"]["max_new_tokens"] == 32
          assert result["generation"]["max_new_bytes"] == 128
          print("100/100 answers; same holdout, tokenizer verification, greedy decoding and generation limits.")
          print("Checkpoint SHA-256:", result["checkpoint_sha256"])
          print("Tokenizer SHA-256:", result["tokenizer_sha256"])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ronin-10m-checkpoint-10000-holdout-100-${{ github.run_id }}
          path: |
            runs/checkpoint-10000-holdout/
            benchmarks/inference-holdout-v1.jsonl
          if-no-files-found: error
          retention-days: 90
