name: RONIN-10M — manual 5k continuation (no cache)

on:
  workflow_dispatch:
    inputs:
      corpus_run_id:
        description: "Verified MINIRONIN unified corpus run"
        required: true
        default: "42523463620"
        type: string
      tokenizer_run_id:
        description: "Successful standalone 8k tokenizer run"
        required: true
        default: "42849436025"
        type: string
      parent_run_id:
        description: "Successful 5k training run whose checkpoint becomes this run's parent"
        required: true
        default: "42877522370"
        type: string
      generation:
        description: "Manual continuation generation"
        required: true
        default: "2"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: roninia-10m-manual-continuation
  cancel-in-progress: false

jobs:
  train-and-continue:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve parent and generation
        id: chain
        env:
          PARENT_INPUT: ${{ inputs.parent_run_id }}
          GENERATION_INPUT: ${{ inputs.generation }}
        run: |
          set -euo pipefail
          [[ "$PARENT_INPUT" =~ ^[0-9]+$ ]]
          [[ "$GENERATION_INPUT" =~ ^[2-9][0-9]*$|^1[0-9]+$ ]]
          echo "parent_run_id=$PARENT_INPUT" >> "$GITHUB_OUTPUT"
          echo "generation=$GENERATION_INPUT" >> "$GITHUB_OUTPUT"
          if [[ "$GENERATION_INPUT" == "2" && "$PARENT_INPUT" == "42877522370" ]]; then
            echo "initial=true" >> "$GITHUB_OUTPUT"
          else
            echo "initial=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify source corpus run
        env:
          GH_TOKEN: ${{ github.token }}
          CORPUS_RUN_ID: ${{ inputs.corpus_run_id }}
        run: |
          set -euo pipefail
          [[ "$CORPUS_RUN_ID" =~ ^[0-9]+$ ]]
          run="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/orbitalronin94/MINIRONIN/actions/runs/$CORPUS_RUN_ID")"
          test "$(jq -r .status <<<"$run")" = "completed"
          test "$(jq -r .conclusion <<<"$run")" = "success"
          test "$(jq -r .head_branch <<<"$run")" = "main"

      - name: Download and prepare source corpus
        uses: actions/download-artifact@v4
        with:
          name: minironin-unified-train-corpus-${{ inputs.corpus_run_id }}
          github-token: ${{ github.token }}
          repository: orbitalronin94/MINIRONIN
          run-id: ${{ inputs.corpus_run_id }}
          path: minironin-unified

      - name: Verify source corpus and build train text
        run: |
          set -euo pipefail
          test -s minironin-unified/train.jsonl.gz
          test -s minironin-unified/sources.json
          test -s minironin-unified/quality-report.json
          test -s minironin-unified/SHA256SUMS
          (cd minironin-unified && sha256sum -c SHA256SUMS)
          available=$(df --output=avail -k . | tail -1 | tr -d ' ')
          test "$available" -gt 3000000
          python scripts/prepare_corpus.py --input-root minironin-unified \
            --output data/corpus/train.txt --manifest data/corpus/corpus-manifest.json \
            --source-run-id "${{ inputs.corpus_run_id }}"
          test -s data/corpus/train.txt

      - name: Install tokenizer and training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tokenizers numpy
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Download reusable 8k tokenizer
        uses: actions/download-artifact@v4
        with:
          name: roninia-tokenizer-8k-${{ hashFiles('data/corpus/corpus-manifest.json') }}
          github-token: ${{ github.token }}
          repository: orbitalronin94/RONINIA
          run-id: ${{ inputs.tokenizer_run_id }}
          path: tokenizer

      - name: Verify tokenizer and tokenize corpus in this run
        run: |
          set -euo pipefail
          test -s tokenizer/tokenizer.json
          test -s tokenizer/manifest.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          corpus = json.loads(Path("data/corpus/corpus-manifest.json").read_text())
          tok = json.loads(Path("tokenizer/manifest.json").read_text())
          actual = hashlib.sha256(Path("tokenizer/tokenizer.json").read_bytes()).hexdigest()
          assert tok["vocab_size"] == 8192
          assert tok["tokenizer_sha256"] == actual
          assert tok["corpus_sha256"] == corpus["corpus_sha256"]
          assert tok["corpus_bytes"] == corpus["text_bytes"]
          assert str(tok["source_corpus_run_id"]) == str(corpus["source_run_id"])
          assert tok["evaluation_records_excluded"] == corpus["evaluation_records_excluded"]
          PY
          mkdir -p token-cache
          python scripts/tokenize_corpus.py \
            --corpus data/corpus/train.txt \
            --tokenizer tokenizer/tokenizer.json \
            --corpus-manifest data/corpus/corpus-manifest.json \
            --output token-cache/corpus-tokens.u16 \
            --manifest token-cache/token-manifest.json
          (cd token-cache && sha256sum corpus-tokens.u16 token-manifest.json > SHA256SUMS)

      - name: Verify parent training run
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_RUN_ID: ${{ steps.chain.outputs.parent_run_id }}
        run: |
          set -euo pipefail
          run="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/orbitalronin94/RONINIA/actions/runs/$PARENT_RUN_ID")"
          test "$(jq -r .status <<<"$run")" = "completed"
          test "$(jq -r .conclusion <<<"$run")" = "success"

      - name: Download original 5k baseline checkpoint
        if: steps.chain.outputs.initial == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ronin-10m-speed-trial-5k-42877522370
          github-token: ${{ github.token }}
          repository: orbitalronin94/RONINIA
          run-id: ${{ steps.chain.outputs.parent_run_id }}
          path: parent-artifact

      - name: Download previous generation checkpoint
        if: steps.chain.outputs.initial == 'false'
        uses: actions/download-artifact@v4
        with:
          name: ronin-10m-chain-${{ steps.chain.outputs.parent_run_id }}
          github-token: ${{ github.token }}
          repository: orbitalronin94/RONINIA
          run-id: ${{ steps.chain.outputs.parent_run_id }}
          path: parent-artifact

      - name: Normalize and verify parent checkpoint
        env:
          INITIAL_PARENT: ${{ steps.chain.outputs.initial }}
        run: |
          set -euo pipefail
          if [[ "$INITIAL_PARENT" == "true" ]]; then
            test -s parent-artifact/checkpoint-5000.pt
            cp parent-artifact/checkpoint-5000.pt parent-artifact/checkpoint-parent.pt
          fi
          test -s parent-artifact/checkpoint-parent.pt
          sha256sum parent-artifact/checkpoint-parent.pt

      - name: Build fixed architecture speed config
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("configs/ronin-10m.json").read_text())
          config["context_length"] = 256
          Path("configs/ronin-10m-speed-256.json").write_text(json.dumps(config, indent=2) + chr(10))
          PY

      - name: Continue training for another 5,000 steps from parent
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_PROC_BIND: CLOSE
          OMP_PLACES: CORES
          PARENT_RUN_ID: ${{ steps.chain.outputs.parent_run_id }}
          GENERATION: ${{ steps.chain.outputs.generation }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import runpy, sys, torch
          torch.set_num_threads(1)
          torch.set_num_interop_threads(1)
          sys.argv = [
              "scripts/train.py",
              "--config", "configs/ronin-10m-speed-256.json",
              "--tokens", "token-cache/corpus-tokens.u16",
              "--token-manifest", "token-cache/token-manifest.json",
              "--resume", "parent-artifact/checkpoint-parent.pt",
              "--output-dir", "runs/ronin-10m-chain",
              "--steps", "5000",
              "--threads", "1",
              "--batch-size", "2",
              "--learning-rate", "1e-4",
              "--warmup-steps", "0",
              "--min-lr-ratio", "1.0",
              "--checkpoint-every", "1000",
              "--eval-batches", "8",
          ]
          runpy.run_path("scripts/train.py", run_name="__main__")
          PY

      - name: Select final checkpoint and write lineage metadata
        env:
          PARENT_RUN_ID: ${{ steps.chain.outputs.parent_run_id }}
          GENERATION: ${{ steps.chain.outputs.generation }}
          CORPUS_RUN_ID: ${{ inputs.corpus_run_id }}
          TOKENIZER_RUN_ID: ${{ inputs.tokenizer_run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, shutil
          from pathlib import Path
          out = Path("runs/ronin-10m-chain")
          checkpoints = list(out.glob("checkpoint-*.pt"))
          if not checkpoints:
              raise SystemExit("No checkpoints produced")
          latest = max(checkpoints, key=lambda p: int(re.search(r"checkpoint-(\\d+)", p.name).group(1)))
          shutil.copy2(latest, out / "checkpoint-parent.pt")
          meta = {
              "generation": int(os.environ["GENERATION"]),
              "parent_run_id": int(os.environ["PARENT_RUN_ID"]),
              "corpus_run_id": int(os.environ["CORPUS_RUN_ID"]),
              "tokenizer_run_id": int(os.environ["TOKENIZER_RUN_ID"]),
              "latest_checkpoint": latest.name,
              "cumulative_steps": int(re.search(r"checkpoint-(\\d+)", latest.name).group(1)),
          }
          (out / "lineage.json").write_text(json.dumps(meta, indent=2) + chr(10))
          print(json.dumps(meta, indent=2))
          PY

      - name: Upload child checkpoint and lineage
        uses: actions/upload-artifact@v4
        with:
          name: ronin-10m-chain-${{ github.run_id }}
          path: |
            runs/ronin-10m-chain/checkpoint-parent.pt
            runs/ronin-10m-chain/checkpoint-*.pt
            runs/ronin-10m-chain/SHA256SUMS
            runs/ronin-10m-chain/progress.json
            runs/ronin-10m-chain/lineage.json
            token-cache/token-manifest.json
            configs/ronin-10m-speed-256.json
          if-no-files-found: error
          retention-days: 30
