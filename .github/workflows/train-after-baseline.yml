name: RONIN-10M — continuous parent training loop

on:
  workflow_run:
    workflows: ["RONIN-10M — prepare reusable token cache"]
    types: [completed]
  workflow_dispatch:
    inputs:
      token_cache_run_id:
        description: "Successful run containing the reusable token cache"
        required: true
        type: string
      parent_run_id:
        description: "Successful training run whose checkpoint becomes this run's parent"
        required: true
        type: string
      generation:
        description: "Continuous training generation number"
        required: true
        default: "2"
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: roninia-10m-continuous-parent-loop
  cancel-in-progress: false

jobs:
  train-and-continue:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve cache, parent and generation
        id: chain
        env:
          EVENT_NAME: ${{ github.event_name }}
          CACHE_INPUT: ${{ inputs.token_cache_run_id }}
          PARENT_INPUT: ${{ inputs.parent_run_id }}
          GENERATION_INPUT: ${{ inputs.generation }}
          PREPARATION_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            echo "cache_run_id=$PREPARATION_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "parent_run_id=42877522370" >> "$GITHUB_OUTPUT"
            echo "generation=2" >> "$GITHUB_OUTPUT"
            echo "initial=true" >> "$GITHUB_OUTPUT"
          else
            [[ "$CACHE_INPUT" =~ ^[0-9]+$ ]]
            [[ "$PARENT_INPUT" =~ ^[0-9]+$ ]]
            [[ "$GENERATION_INPUT" =~ ^[2-9][0-9]*$|^1[0-9]+$ ]]
            echo "cache_run_id=$CACHE_INPUT" >> "$GITHUB_OUTPUT"
            echo "parent_run_id=$PARENT_INPUT" >> "$GITHUB_OUTPUT"
            echo "generation=$GENERATION_INPUT" >> "$GITHUB_OUTPUT"
            echo "initial=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify reusable cache run
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_RUN_ID: ${{ steps.chain.outputs.cache_run_id }}
        run: |
          set -euo pipefail
          run="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/orbitalronin94/RONINIA/actions/runs/$CACHE_RUN_ID")"
          test "$(jq -r .status <<<"$run")" = "completed"
          test "$(jq -r .conclusion <<<"$run")" = "success"

      - name: Wait for original 5k baseline to finish
        if: steps.chain.outputs.initial == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN_ID: ${{ steps.chain.outputs.parent_run_id }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 21600))
          while true; do
            run="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/orbitalronin94/RONINIA/actions/runs/$BASELINE_RUN_ID")"
            status="$(jq -r .status <<<"$run")"
            conclusion="$(jq -r .conclusion <<<"$run")"
            echo "Initial baseline: status=$status conclusion=$conclusion"
            if [[ "$status" == "completed" ]]; then
              test "$conclusion" = "success"
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for the initial 5k baseline"
              exit 1
            fi
            sleep 60
          done

      - name: Wait five minutes before first continuation
        if: steps.chain.outputs.initial == 'true'
        run: sleep 300

      - name: Download original baseline checkpoint
        if: steps.chain.outputs.initial == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ronin-10m-speed-trial-5k-42877522370
          github-token: ${{ github.token }}
          repository: orbitalronin94/RONINIA
          run-id: ${{ steps.chain.outputs.parent_run_id }}
          path: parent-artifact

      - name: Download previous generation checkpoint
        if: steps.chain.outputs.initial == 'false'
        uses: actions/download-artifact@v4
        with:
          name: ronin-10m-chain-${{ steps.chain.outputs.parent_run_id }}
          github-token: ${{ github.token }}
          repository: orbitalronin94/RONINIA
          run-id: ${{ steps.chain.outputs.parent_run_id }}
          path: parent-artifact

      - name: Normalize and verify parent checkpoint
        env:
          INITIAL_PARENT: ${{ steps.chain.outputs.initial }}
        run: |
          set -euo pipefail
          if [[ "$INITIAL_PARENT" == "true" ]]; then
            test -s parent-artifact/checkpoint-5000.pt
            cp parent-artifact/checkpoint-5000.pt parent-artifact/checkpoint-parent.pt
          fi
          test -s parent-artifact/checkpoint-parent.pt
          sha256sum parent-artifact/checkpoint-parent.pt

      - name: Download immutable pretokenized corpus cache
        uses: actions/download-artifact@v4
        with:
          name: roninia-token-cache-${{ steps.chain.outputs.cache_run_id }}
          github-token: ${{ github.token }}
          repository: orbitalronin94/RONINIA
          run-id: ${{ steps.chain.outputs.cache_run_id }}
          path: token-cache

      - name: Verify cache integrity and compatibility
        run: |
          set -euo pipefail
          (cd token-cache && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          m = json.loads(Path("token-cache/token-manifest.json").read_text())
          p = Path("token-cache/corpus-tokens.u16")
          assert m["schema"] == "roninia-token-cache-v1"
          assert m["dtype"] == "uint16"
          assert m["vocab_size"] == 8192
          assert m["token_count"] * 2 == p.stat().st_size
          assert m["tokens_bytes"] == p.stat().st_size
          h = hashlib.sha256()
          with p.open("rb") as f:
              for chunk in iter(lambda: f.read(8 * 1024 * 1024), b""):
                  h.update(chunk)
          assert m["tokens_sha256"] == h.hexdigest()
          print(json.dumps({k:m[k] for k in ("token_count","tokens_bytes","corpus_sha256","tokenizer_sha256")}, indent=2))
          PY

      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install tokenizers numpy

      - name: Build fixed architecture speed config
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("configs/ronin-10m.json").read_text())
          config["context_length"] = 256
          Path("configs/ronin-10m-speed-256.json").write_text(json.dumps(config, indent=2) + chr(10))
          PY

      - name: Continue training for another 5,000 steps from parent
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_PROC_BIND: CLOSE
          OMP_PLACES: CORES
          PARENT_RUN_ID: ${{ steps.chain.outputs.parent_run_id }}
          GENERATION: ${{ steps.chain.outputs.generation }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import runpy, sys, torch
          torch.set_num_threads(1)
          torch.set_num_interop_threads(1)
          sys.argv = [
              "scripts/train.py",
              "--config", "configs/ronin-10m-speed-256.json",
              "--tokens", "token-cache/corpus-tokens.u16",
              "--token-manifest", "token-cache/token-manifest.json",
              "--resume", "parent-artifact/checkpoint-parent.pt",
              "--output-dir", "runs/ronin-10m-chain",
              "--steps", "5000",
              "--threads", "1",
              "--batch-size", "2",
              "--learning-rate", "1e-4",
              "--warmup-steps", "0",
              "--min-lr-ratio", "1.0",
              "--checkpoint-every", "1000",
              "--eval-batches", "8",
          ]
          runpy.run_path("scripts/train.py", run_name="__main__")
          PY

      - name: Select final checkpoint and write lineage metadata
        env:
          PARENT_RUN_ID: ${{ steps.chain.outputs.parent_run_id }}
          GENERATION: ${{ steps.chain.outputs.generation }}
          CACHE_RUN_ID: ${{ steps.chain.outputs.cache_run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, shutil
          from pathlib import Path
          out = Path("runs/ronin-10m-chain")
          checkpoints = list(out.glob("checkpoint-*.pt"))
          if not checkpoints:
              raise SystemExit("No checkpoints produced")
          latest = max(checkpoints, key=lambda p: int(re.search(r"checkpoint-(\d+)", p.name).group(1)))
          shutil.copy2(latest, out / "checkpoint-parent.pt")
          meta = {
              "generation": int(os.environ["GENERATION"]),
              "parent_run_id": int(os.environ["PARENT_RUN_ID"]),
              "cache_run_id": int(os.environ["CACHE_RUN_ID"]),
              "latest_checkpoint": latest.name,
              "cumulative_steps": int(re.search(r"checkpoint-(\d+)", latest.name).group(1)),
          }
          (out / "lineage.json").write_text(json.dumps(meta, indent=2) + chr(10))
          print(json.dumps(meta, indent=2))
          PY

      - name: Upload child checkpoint and lineage
        uses: actions/upload-artifact@v4
        with:
          name: ronin-10m-chain-${{ github.run_id }}
          path: |
            runs/ronin-10m-chain/checkpoint-parent.pt
            runs/ronin-10m-chain/checkpoint-*.pt
            runs/ronin-10m-chain/SHA256SUMS
            runs/ronin-10m-chain/progress.json
            runs/ronin-10m-chain/lineage.json
            token-cache/token-manifest.json
            configs/ronin-10m-speed-256.json
          if-no-files-found: error
          retention-days: 30

      - name: Wait five minutes and dispatch the next generation
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_PARENT_RUN_ID: ${{ github.run_id }}
          CACHE_RUN_ID: ${{ steps.chain.outputs.cache_run_id }}
          GENERATION: ${{ steps.chain.outputs.generation }}
        run: |
          set -euo pipefail
          sleep 300
          next_generation=$((GENERATION + 1))
          payload="$(jq -n \
            --arg ref "main" \
            --arg parent "$NEXT_PARENT_RUN_ID" \
            --arg cache "$CACHE_RUN_ID" \
            --arg generation "$next_generation" \
            '{ref:$ref, inputs:{parent_run_id:$parent, token_cache_run_id:$cache, generation:$generation}}')"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/orbitalronin94/RONINIA/actions/workflows/train-after-baseline.yml/dispatches \
            -d "$payload"
          echo "Dispatched generation $next_generation from parent run $NEXT_PARENT_RUN_ID"
