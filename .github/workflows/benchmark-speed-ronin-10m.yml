name: RONIN-10M — CPU speed benchmark (200 steps x configuration)
on:
  pull_request:
    paths:
      - "scripts/benchmark_speed.py"
      - ".github/workflows/benchmark-speed-ronin-10m.yml"
  workflow_dispatch:
    inputs:
      corpus_run_id:
        description: "Verified MINIRONIN corpus run"
        required: true
        default: "42523463620"
        type: string
      tokenizer_run_id:
        description: "Successful 8k tokenizer run"
        required: true
        default: "42849436025"
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: roninia-speed-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify source corpus run
        env:
          GH_TOKEN: ${{ github.token }}
          CORPUS_RUN_ID: ${{ inputs.corpus_run_id || '42523463620' }}
        run: |
          set -euo pipefail
          run="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/orbitalronin94/MINIRONIN/actions/runs/$CORPUS_RUN_ID")"
          test "$(jq -r .status <<<"$run")" = "completed"
          test "$(jq -r .conclusion <<<"$run")" = "success"
          test "$(jq -r .head_branch <<<"$run")" = "main"
      - name: Download MINIRONIN corpus
        uses: actions/download-artifact@v4
        with:
          name: minironin-unified-train-corpus-${{ inputs.corpus_run_id || '42523463620' }}
          github-token: ${{ github.token }}
          repository: orbitalronin94/MINIRONIN
          run-id: ${{ inputs.corpus_run_id || '42523463620' }}
          path: minironin-unified
      - name: Verify corpus artifact
        run: |
          set -euo pipefail
          test -s minironin-unified/train.jsonl.gz
          test -s minironin-unified/SHA256SUMS
          (cd minironin-unified && sha256sum -c SHA256SUMS)
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install tokenizers numpy
      - name: Prepare corpus
        run: |
          python scripts/prepare_corpus.py --input-root minironin-unified \
            --output data/corpus/train.txt --manifest data/corpus/corpus-manifest.json \
            --source-run-id "${{ inputs.corpus_run_id || '42523463620' }}"
      - name: Download matching tokenizer
        uses: actions/download-artifact@v4
        with:
          name: roninia-tokenizer-8k-${{ hashFiles('data/corpus/corpus-manifest.json') }}
          github-token: ${{ github.token }}
          repository: orbitalronin94/RONINIA
          run-id: ${{ inputs.tokenizer_run_id || '42849436025' }}
          path: tokenizer
      - name: Verify tokenizer and corpus identity
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          corpus=json.loads(Path("data/corpus/corpus-manifest.json").read_text())
          manifest=json.loads(Path("tokenizer/manifest.json").read_text())
          actual=hashlib.sha256(Path("tokenizer/tokenizer.json").read_bytes()).hexdigest()
          assert manifest["vocab_size"] == 8192
          assert manifest["tokenizer_sha256"] == actual
          assert manifest["corpus_sha256"] == corpus["corpus_sha256"]
          assert manifest["corpus_bytes"] == corpus["text_bytes"]
          assert manifest["source_corpus_run_id"] == corpus["source_run_id"]
          assert manifest["evaluation_records_excluded"] == corpus["evaluation_records_excluded"]
          PY
      - name: Run 200-step configurations
        run: |
          python scripts/benchmark_speed.py --config configs/ronin-10m.json \
            --corpus data/corpus/train.txt --tokenizer tokenizer/tokenizer.json \
            --steps 200 --warmup-steps 20 --output-dir benchmark-results
      - uses: actions/upload-artifact@v4
        with:
          name: roninia-speed-benchmark-${{ github.run_id }}
          path: benchmark-results/benchmark.*
          if-no-files-found: error
          retention-days: 30
