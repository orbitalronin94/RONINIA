name: RONIN-10M — 137.5k official inference holdout

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/checkpoint-holdout-ronin-10m-137500.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: roninia-checkpoint-137500-official-holdout
  cancel-in-progress: false

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TRAIN_RUN_ID: "43114609945"
      CHECKPOINT_ARTIFACT: "ronin-10m-chain-137500-43114609945"
      EXPECTED_CHECKPOINT_SHA256: "d2c30940ade76e82bc5e7569c96af6ac4337173d141f627410eb40847e245727"
      TOKENIZER_RUN_ID: "42849436025"
      TOKENIZER_ARTIFACT: "roninia-tokenizer-8k-0f83e1bf4ca6aa7c08cb412d3bf48a5a7de961d012fd4abfe6f648e7ed029617"
      EXPECTED_TOKENIZER_SHA256: "605834d0d1deea545518be54ae0936060845107b906172f6628d0ff9520e57a4"
      EXPECTED_HOLDOUT_SHA256: "3cd8c1eb3142ebf9c6cc17d2e19353be3472d61ac7b7cfb6de0cbb233cf4a535"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify successful 100k-to-137.5k training run and immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/orbitalronin94/RONINIA/actions/runs/$TRAIN_RUN_ID")"
          test "$(jq -r .id <<<"$run")" = "$TRAIN_RUN_ID"
          test "$(jq -r .status <<<"$run")" = "completed"
          test "$(jq -r .conclusion <<<"$run")" = "success"
          artifacts="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/orbitalronin94/RONINIA/actions/runs/$TRAIN_RUN_ID/artifacts")"
          echo "$artifacts" | jq -e --arg name "$CHECKPOINT_ARTIFACT" '.artifacts[] | select(.name == $name and .expired == false)' >/dev/null
          echo "$run" | jq '{id,status,conclusion,html_url}'
          echo "$artifacts" | jq --arg name "$CHECKPOINT_ARTIFACT" '.artifacts[] | select(.name == $name) | {name,id,size_in_bytes,digest}'

      - name: Download immutable 137.5k checkpoint chain
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CHECKPOINT_ARTIFACT }}
          github-token: ${{ github.token }}
          repository: orbitalronin94/RONINIA
          run-id: ${{ env.TRAIN_RUN_ID }}
          path: checkpoint-chain

      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install tokenizers numpy

      - name: Verify exact 137500 checkpoint, SHA-256 and lineage
        id: checkpoint
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find checkpoint-chain -type f -name 'checkpoint-137500.pt' -size +0c)
          test "${#candidates[@]}" -eq 1
          checkpoint="${candidates[0]}"
          actual="$(sha256sum "$checkpoint" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_CHECKPOINT_SHA256"
          python - "$checkpoint" "$EXPECTED_TOKENIZER_SHA256" <<'PY'
          import sys,torch
          p=torch.load(sys.argv[1],map_location="cpu",weights_only=False)
          assert int(p.get("completed_steps",-1)) == 137500, p.get("completed_steps")
          assert p.get("tokenizer_sha256") == sys.argv[2], p.get("tokenizer_sha256")
          print({"completed_steps":p["completed_steps"],"validation_loss":p.get("validation_loss"),"parameter_count":p.get("parameter_count"),"tokenizer_sha256":p.get("tokenizer_sha256")})
          PY
          python - "$checkpoint-chain/ronin-10m-137500-from-100k/lineage.json" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          if p.exists():
            d=json.loads(p.read_text())
            assert d.get("cumulative_steps") == 137500, d
            assert d.get("latest_checkpoint") == "checkpoint-137500.pt", d
            assert d.get("latest_checkpoint_sha256") == "d2c30940ade76e82bc5e7569c96af6ac4337173d141f627410eb40847e245727", d
            print({"parent_run_id":d.get("parent_run_id"),"steps_this_run":d.get("steps_this_run"),"cumulative_steps":d.get("cumulative_steps"),"latest_checkpoint":d.get("latest_checkpoint")})
          else:
            print("Lineage file not found at expected nested path; checkpoint hash and metadata remain authoritative.")
          PY
          echo "path=$checkpoint" >> "$GITHUB_OUTPUT"
          echo "sha256=$actual" >> "$GITHUB_OUTPUT"
          echo "Verified checkpoint-137500.pt SHA-256: $actual"

      - name: Download exact 8k tokenizer used by the model
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TOKENIZER_ARTIFACT }}
          github-token: ${{ github.token }}
          repository: orbitalronin94/RONINIA
          run-id: ${{ env.TOKENIZER_RUN_ID }}
          path: tokenizer

      - name: Download and verify immutable official 100-question holdout
        run: |
          set -euo pipefail
          mkdir -p benchmarks
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/orbitalronin94/MINIRONIN/main/benchmarks/inference-holdout-v1.jsonl -o benchmarks/inference-holdout-v1.jsonl
          test "$(grep -cve '^$' benchmarks/inference-holdout-v1.jsonl)" -eq 100
          echo "$EXPECTED_HOLDOUT_SHA256  benchmarks/inference-holdout-v1.jsonl" | sha256sum -c -
          test "$(sha256sum tokenizer/tokenizer.json | awk '{print $1}')" = "$EXPECTED_TOKENIZER_SHA256"

      - name: Generate 100 official answers from checkpoint 137500
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python scripts/checkpoint_holdout.py \
            --checkpoint "${{ steps.checkpoint.outputs.path }}" \
            --tokenizer tokenizer/tokenizer.json \
            --holdout benchmarks/inference-holdout-v1.jsonl \
            --output-dir runs/checkpoint-137500-holdout \
            --expected-steps 137500 \
            --threads 2 --max-new-tokens 32 --max-new-bytes 128

      - name: Verify official benchmark protocol and checkpoint identity
        env:
          CHECKPOINT_SHA256: ${{ steps.checkpoint.outputs.sha256 }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads(Path("runs/checkpoint-137500-holdout/checkpoint-137500-holdout-100.json").read_text())
          assert result["completed_steps"] == 137500
          assert result["checkpoint_sha256"] == os.environ["CHECKPOINT_SHA256"]
          assert result["tokenizer_sha256"] == "605834d0d1deea545518be54ae0936060845107b906172f6628d0ff9520e57a4"
          assert result["holdout_count"] == 100
          assert result["holdout_sha256"] == "3cd8c1eb3142ebf9c6cc17d2e19353be3472d61ac7b7cfb6de0cbb233cf4a535"
          assert result["generation"]["threads"] == 2
          assert result["generation"]["max_new_tokens"] == 32
          assert result["generation"]["max_new_bytes"] == 128
          print("100/100 official questions; exact 137.5k checkpoint, tokenizer and generation protocol verified.")
          print("Checkpoint:",result["checkpoint_sha256"])
          print("Tokenizer:",result["tokenizer_sha256"])
          print("Holdout:",result["holdout_sha256"])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ronin-10m-checkpoint-137500-official-holdout-100-${{ github.run_id }}
          path: |
            runs/checkpoint-137500-holdout/
            benchmarks/inference-holdout-v1.jsonl
          if-no-files-found: error
          retention-days: 90
