name: RONIN-10M — continue with Spanish + synthetic preloaded cache

on:
  workflow_dispatch:
    inputs:
      parent_run_id:
        description: "Successful training run that produced the parent checkpoint"
        required: true
        type: string
      parent_artifact_name:
        description: "Immutable chain artifact containing the parent checkpoint"
        required: true
        type: string
      parent_checkpoint_name:
        description: "Exact checkpoint filename, e.g. checkpoint-152500.pt"
        required: true
        type: string
      parent_checkpoint_sha256:
        description: "Expected SHA-256 of the parent checkpoint"
        required: true
        type: string
      additional_steps:
        description: "Additional training steps (multiple of 1,000)"
        required: true
        default: "15000"
        type: string
      learning_rate:
        description: "Learning rate for this continuation"
        required: true
        default: "0.000025"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: roninia-spanish-synthetic-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    env:
      PARENT_RUN_ID: ${{ inputs.parent_run_id }}
      PARENT_ARTIFACT_NAME: ${{ inputs.parent_artifact_name }}
      PARENT_CHECKPOINT_NAME: ${{ inputs.parent_checkpoint_name }}
      EXPECTED_PARENT_SHA256: ${{ inputs.parent_checkpoint_sha256 }}
      ADDITIONAL_STEPS: ${{ inputs.additional_steps }}
      LEARNING_RATE: ${{ inputs.learning_rate }}
      EXPECTED_TOKENIZER_SHA256: "605834d0d1deea545518be54ae0936060845107b906172f6628d0ff9520e57a4"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy tokenizers

      - name: Verify parent run and requested training parameters
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PARENT_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$ADDITIONAL_STEPS" =~ ^[0-9]+$ ]]
          test "$ADDITIONAL_STEPS" -gt 0
          test $((ADDITIONAL_STEPS % 1000)) -eq 0
          python - <<'PY'
          import os
          value=float(os.environ["LEARNING_RATE"])
          assert 0 < value <= 0.001, value
          PY
          run="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/orbitalronin94/RONINIA/actions/runs/$PARENT_RUN_ID")"
          test "$(jq -r .status <<<"$run")" = "completed"
          test "$(jq -r .conclusion <<<"$run")" = "success"
          test "$(jq -r .head_branch <<<"$run")" = "main"

      - name: Download parent checkpoint chain
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PARENT_ARTIFACT_NAME }}
          github-token: ${{ github.token }}
          repository: orbitalronin94/RONINIA
          run-id: ${{ env.PARENT_RUN_ID }}
          path: parent-artifact

      - name: Verify parent checkpoint, model configuration and tokenizer
        id: parent
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find parent-artifact -type f -name "$PARENT_CHECKPOINT_NAME" -size +0c)
          if [ "${#candidates[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one $PARENT_CHECKPOINT_NAME, found ${#candidates[@]}"
            find parent-artifact -maxdepth 5 -type f -printf '%p %s bytes\n'
            exit 1
          fi
          cp "${candidates[0]}" checkpoint-parent.pt
          actual="$(sha256sum checkpoint-parent.pt | awk '{print $1}')"
          test "$actual" = "$EXPECTED_PARENT_SHA256"
          python - <<'PY'
          import json, os, torch
          from pathlib import Path
          config=json.loads(Path("configs/ronin-10m.json").read_text())
          config["context_length"]=256
          Path("configs/ronin-10m-speed-256.json").write_text(json.dumps(config,indent=2)+chr(10))
          parent=torch.load("checkpoint-parent.pt",map_location="cpu",weights_only=False)
          assert parent.get("config")==config, {"parent_config":parent.get("config"),"expected":config}
          assert parent.get("tokenizer_sha256")=="605834d0d1deea545518be54ae0936060845107b906172f6628d0ff9520e57a4"
          step=int(parent.get("completed_steps",-1))
          assert step>0
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as output:
              output.write(f"parent_step={step}\n")
              output.write(f"parent_corpus_sha256={parent.get('corpus_sha256') or ''}\n")
              output.write(f"parent_tokenizer_sha256={parent['tokenizer_sha256']}\n")
              output.write(f"target_step={step+int(os.environ['ADDITIONAL_STEPS'])}\n")
          print(json.dumps({"parent_step":step,"validation_loss":parent.get("validation_loss"),"parameter_count":parent.get("parameter_count"),"corpus_sha256":parent.get("corpus_sha256"),"tokenizer_sha256":parent.get("tokenizer_sha256")},indent=2))
          PY

      - name: Resolve latest successful version-2 Spanish + synthetic cache run
        id: cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/orbitalronin94/RONINIA/actions/runs?per_page=100")"
          cache_run_id="$(jq -r '[.workflow_runs[] | select(.name=="RONIN-10M — prepare Spanish + synthetic preloaded token cache" and .status=="completed" and .conclusion=="success" and .head_branch=="main")][0].id // empty' <<<"$runs")"
          test -n "$cache_run_id"
          cache_run="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/orbitalronin94/RONINIA/actions/runs/$cache_run_id")"
          test "$(jq -r .status <<<"$cache_run")" = "completed"
          test "$(jq -r .conclusion <<<"$cache_run")" = "success"
          echo "cache_run_id=$cache_run_id" >> "$GITHUB_OUTPUT"
          echo "Using preloaded cache run $cache_run_id"

      - name: Download immutable pretokenized cache (no corpus rebuild, no retokenization)
        uses: actions/download-artifact@v4
        with:
          name: roninia-spanish-synthetic-token-cache-${{ steps.cache.outputs.cache_run_id }}
          github-token: ${{ github.token }}
          repository: orbitalronin94/RONINIA
          run-id: ${{ steps.cache.outputs.cache_run_id }}
          path: cache-artifact

      - name: Verify cache checksums, selection policy and parent tokenizer identity
        run: |
          set -euo pipefail
          test -s cache-artifact/token-cache/corpus-tokens.u16
          test -s cache-artifact/token-cache/token-manifest.json
          test -s cache-artifact/token-cache/SHA256SUMS
          test -s cache-artifact/data/corpus/corpus-manifest.json
          (cd cache-artifact/token-cache && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          def digest(path):
              h=hashlib.sha256()
              with Path(path).open("rb") as stream:
                  for block in iter(lambda:stream.read(8*1024*1024),b""): h.update(block)
              return h.hexdigest()
          cache=json.loads(Path("cache-artifact/token-cache/token-manifest.json").read_text())
          corpus=json.loads(Path("cache-artifact/data/corpus/corpus-manifest.json").read_text())
          tokens=Path("cache-artifact/token-cache/corpus-tokens.u16")
          corpus_manifest=Path("cache-artifact/data/corpus/corpus-manifest.json")
          assert cache["schema"]=="roninia-token-cache-v1" and cache["dtype"]=="uint16"
          assert cache["vocab_size"]==8192
          assert cache["tokenizer_sha256"]==os.environ["EXPECTED_TOKENIZER_SHA256"]
          assert cache["selection_policy_version"]==2
          assert cache["selection_policy"]=="all_synthetic_plus_verified_spanish_non_synthetic_target_language_precedence"
          assert cache["synthetic_records_included"]>0 and cache["spanish_source_records_included"]>0
          assert cache["corpus_sha256"]==corpus["corpus_sha256"]
          assert digest(corpus_manifest)==cache["corpus_manifest_sha256"]
          assert cache["tokens_bytes"]==tokens.stat().st_size==cache["token_count"]*2
          assert digest(tokens)==cache["tokens_sha256"]
          print(json.dumps({k:cache.get(k) for k in ("source_run_id","selection_policy_version","records_total","synthetic_records_included","spanish_source_records_included","excluded_non_synthetic_non_spanish","excluded_non_synthetic_unverified_language","corpus_sha256","tokenizer_sha256","token_count","tokens_bytes")},ensure_ascii=False,indent=2))
          PY

      - name: Continue training on the preloaded cache
        env:
          OUT_DIR: ${{ format('runs/ronin-10m-spanish-synthetic-{0}-to-{1}', steps.parent.outputs.parent_step, steps.parent.outputs.target_step) }}
          PARENT_STEP: ${{ steps.parent.outputs.parent_step }}
          PARENT_CORPUS_SHA256: ${{ steps.parent.outputs.parent_corpus_sha256 }}
          CACHE_RUN_ID: ${{ steps.cache.outputs.cache_run_id }}
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
          OMP_PROC_BIND: CLOSE
          OMP_PLACES: CORES
        run: |
          set -euo pipefail
          echo "Output directory: $OUT_DIR"
          python - <<'PY'
          import os,runpy,sys,torch
          torch.set_num_threads(2)
          torch.set_num_interop_threads(2)
          sys.argv=[
            "scripts/train.py",
            "--config","configs/ronin-10m-speed-256.json",
            "--tokens","cache-artifact/token-cache/corpus-tokens.u16",
            "--token-manifest","cache-artifact/token-cache/token-manifest.json",
            "--resume","checkpoint-parent.pt",
            "--allow-corpus-change",
            "--output-dir",os.environ["OUT_DIR"],
            "--steps",os.environ["ADDITIONAL_STEPS"],
            "--threads","2",
            "--batch-size","4",
            "--learning-rate",os.environ["LEARNING_RATE"],
            "--warmup-steps","0",
            "--min-lr-ratio","1.0",
            "--checkpoint-every","1000",
            "--eval-batches","32",
          ]
          runpy.run_path("scripts/train.py",run_name="__main__")
          PY

      - name: Upload recoverable checkpoints even if a later step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ronin-10m-spanish-synthetic-recovery-${{ github.run_id }}
          path: |
            runs/ronin-10m-spanish-synthetic-*/checkpoint-*.pt
            runs/ronin-10m-spanish-synthetic-*/SHA256SUMS
            runs/ronin-10m-spanish-synthetic-*/progress.json
          if-no-files-found: warn
          retention-days: 90

      - name: Verify final checkpoint and write full lineage
        env:
          OUT_DIR: ${{ format('runs/ronin-10m-spanish-synthetic-{0}-to-{1}', steps.parent.outputs.parent_step, steps.parent.outputs.target_step) }}
          PARENT_STEP: ${{ steps.parent.outputs.parent_step }}
          PARENT_CORPUS_SHA256: ${{ steps.parent.outputs.parent_corpus_sha256 }}
          CACHE_RUN_ID: ${{ steps.cache.outputs.cache_run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          def digest(path):
              h=hashlib.sha256()
              with Path(path).open("rb") as stream:
                  for block in iter(lambda:stream.read(8*1024*1024),b""): h.update(block)
              return h.hexdigest()
          out=Path(os.environ["OUT_DIR"])
          checkpoints=list(out.glob("checkpoint-*.pt"))
          if not checkpoints:
              raise SystemExit("No recoverable checkpoints were produced")
          latest=max(checkpoints,key=lambda p:int(re.search(r"checkpoint-(\d+)",p.name).group(1)))
          step=int(re.search(r"checkpoint-(\d+)",latest.name).group(1))
          target=int(os.environ["PARENT_STEP"])+int(os.environ["ADDITIONAL_STEPS"])
          assert step==target, {"latest_checkpoint":latest.name,"expected":target}
          digest_value=digest(latest)
          cache=json.loads(Path("cache-artifact/token-cache/token-manifest.json").read_text())
          parent=json.loads(Path("cache-artifact/data/corpus/corpus-manifest.json").read_text())
          lineage={
            "parent_run_id":int(os.environ["PARENT_RUN_ID"]),
            "parent_artifact":os.environ["PARENT_ARTIFACT_NAME"],
            "parent_checkpoint":os.environ["PARENT_CHECKPOINT_NAME"],
            "parent_checkpoint_sha256":os.environ["EXPECTED_PARENT_SHA256"],
            "parent_completed_steps":int(os.environ["PARENT_STEP"]),
            "token_cache_run_id":int(os.environ["CACHE_RUN_ID"]),
            "source_corpus_run_id":cache["source_run_id"],
            "corpus_sha256":cache["corpus_sha256"],
            "parent_corpus_sha256":os.environ["PARENT_CORPUS_SHA256"],
            "corpus_changed_from_parent":os.environ["PARENT_CORPUS_SHA256"]!=cache["corpus_sha256"],
            "tokenizer_sha256":cache["tokenizer_sha256"],
            "token_count":cache["token_count"],
            "selection_policy_version":cache["selection_policy_version"],
            "selection_policy":cache["selection_policy"],
            "synthetic_records_included":cache["synthetic_records_included"],
            "spanish_source_records_included":cache["spanish_source_records_included"],
            "steps_this_run":int(os.environ["ADDITIONAL_STEPS"]),
            "cumulative_steps":step,
            "latest_checkpoint":latest.name,
            "latest_checkpoint_sha256":digest_value,
            "training_config":{"context_length":256,"threads":2,"batch_size":4,"learning_rate":float(os.environ["LEARNING_RATE"]),"checkpoint_every":1000,"eval_batches":32,"pretokenized_cache_reused":True,"retokenization":False}
          }
          (out/"lineage.json").write_text(json.dumps(lineage,ensure_ascii=False,indent=2)+chr(10))
          print(json.dumps(lineage,ensure_ascii=False,indent=2))
          PY

      - name: Upload final checkpoint and complete recovery lineage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ronin-10m-spanish-synthetic-chain-${{ github.run_id }}
          path: |
            runs/ronin-10m-spanish-synthetic-*/checkpoint-*.pt
            runs/ronin-10m-spanish-synthetic-*/SHA256SUMS
            runs/ronin-10m-spanish-synthetic-*/progress.json
            runs/ronin-10m-spanish-synthetic-*/lineage.json
            cache-artifact/token-cache/token-manifest.json
            cache-artifact/data/corpus/corpus-manifest.json
            configs/ronin-10m-speed-256.json
          if-no-files-found: warn
          retention-days: 90
