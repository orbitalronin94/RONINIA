[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "roninia"
version = "0.1.0"
description = "RONIN-10M language model trained from scratch"
requires-python = ">=3.11"
dependencies = ["torch>=2.3", "tokenizers>=0.20"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
